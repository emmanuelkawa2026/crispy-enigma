 <!DOCTYPE to </html> 
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Led - Online Data App</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef2ff;padding-bottom:80px}header{background:#1e3a8a;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:20}header h1{margin:0;font-size:15px;font-weight:900}.tabs{display:flex;gap:5px;overflow:auto;padding:8px;background:#fff;position:sticky;top:52px;z-index:19;box-shadow:0 2px 8px rgba(0,0,0,.07)}.tab{white-space:nowrap;padding:8px 11px;border-radius:20px;border:2px solid #1e3a8a;font-weight:800;font-size:11px;background:#fff;color:#1e3a8a;flex-shrink:0}.tab.active{background:#1e3a8a;color:#fff}.search{padding:8px;background:#eef2ff;position:sticky;top:98px;z-index:18}.search input{width:100%;padding:13px;border-radius:12px;border:2px solid #cbd5e1}.card{background:#fff;margin:8px;border-radius:14px;padding:12px;box-shadow:0 3px 10px rgba(0,0,0,.07)}.badge{display:inline-block;background:#dbeafe;color:#1e3a8a;padding:2px 6px;border-radius:7px;font-size:10px;font-weight:800;margin-right:3px}.course{font-weight:900;font-size:14px;margin:4px 0}.meta{font-size:11px;color:#475569;line-height:1.4}.salary{color:#16a34a;font-weight:800}.btns{display:flex;gap:6px;margin-top:8px}.btn{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;border-radius:10px;text-decoration:none;font-weight:900;font-size:12px}.btn-w{background:#1e3a8a;color:#fff}.btn-c{background:#facc15;color:#000}.footer{position:fixed;bottom:0;left:0;right:0;background:#1e3a8a;color:#fff;text-align:center;padding:8px;font-size:10px}#loading{text-align:center;padding:40px;font-weight:900;color:#1e3a8a}</style></head><body><header><h1>TEAM LED ONLINE 360</h1><small id="hdr">Loading data.json using internet... | CEO Kawa 0792408497</small></header><div class="tabs" id="tabs"></div><div class="search"><input id="q" placeholder="Search 360 Courses..." oninput="render()"><div id="stats" style="text-align:center;font-size:11px;color:#475569;padding-top:4px"></div></div><div id="loading">Loading courses from data.json... Uses small data bundle...</div><div id="list"></div><div class="footer">0792408497 | ONLINE DATA APP - Updates from data.json</div><script>
const P="256792408497";let data=null;let active=null;
async function loadData(){try{let r=await fetch('./data.json?v='+Date.now());if(!r.ok) throw 'fail';data=await r.json();active=Object.keys(data)[0];document.getElementById('loading').style.display='none';buildTabs();render();document.getElementById('hdr').innerText=Object.keys(data).length+" Combos | "+Object.values(data).reduce((a,b)=>a+b.length,0)+" Courses | LIVE from data.json | CEO Kawa"}catch(e){document.getElementById('loading').innerHTML="Failed to load data.json - Check internet or file exists<br><small>"+e+"</small><br><br><button onclick='loadData()' style='padding:10px 20px;border-radius:10px;background:#1e3a8a;color:#fff;border:none;font-weight:900'>RETRY</button>"}}
function buildTabs(){let h="";for(let k in data){h+="<div class='tab "+(k==active?'active':'')+"' onclick=\"setTab('"+k+"')\">"+k+" ("+data[k].length+")</div>"}document.getElementById("tabs").innerHTML=h}
function setTab(k){active=k;buildTabs();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){if(!data) return;let q=(document.getElementById("q").value||"").toLowerCase();let list=data[active].filter(x=>!q || (x.c+x.u+x.d).toLowerCase().includes(q));let html="";list.forEach((it,i)=>{let msg=encodeURIComponent("Hello Team Led CEO Kawa, I want "+it.c+" for "+active+" - salary "+it.s);html+="<div class='card'><span class='badge'>"+active+"</span><span class='badge'>#"+(i+1)+"</span><div class='course'>"+(i+1)+". "+it.c+"</div><div class='meta'>"+it.u+"<br><span class='salary'>"+it.s+"</span><br>"+it.d+"</div><div class='btns'><a class='btn btn-w' href='https://wa.me/"+P+"?text="+msg+"'>WHATSAPP</a><a class='btn btn-c' href='tel:+"+P+"'>CALL</a></div></div>"});document.getElementById("list").innerHTML=html;document.getElementById("stats").innerText=list.length+" courses in "+active+" | TOTAL "+Object.values(data).reduce((a,b)=>a+b.length,0)+" from data.json LIVE";}
loadData();
</script></body></html>
