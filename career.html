<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Led 360</title>
<style>
body{margin:0;font-family:Arial;background:#eef2ff}
header{background:#1e3a8a;color:#fff;padding:15px;text-align:center}
.tabs{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff}
.tab{padding:8px 14px;border-radius:20px;border:2px solid #1e3a8a;font-weight:800;background:#fff;color:#1e3a8a}
.tab.active{background:#1e3a8a;color:#fff}
input{width:92%;margin:10px 4%;padding:12px;border-radius:10px;border:2px solid #ccc}
.card{background:#fff;margin:10px;border-radius:12px;padding:12px}
.btns{display:flex;gap:6px;margin-top:10px}
.btn{flex:1;text-align:center;padding:12px;border-radius:8px;text-decoration:none;font-weight:800}
.w{background:#1e3a8a;color:#fff}
.c{background:#facc15;color:#000}
</style>
</head>
<body>
<header><h1>TEAM LED HYBRID 360<br><small>0792408497</small></h1></header>
<div class="tabs" id="tabs"></div>
<input id="q" placeholder="Search course..." oninput="show()">
<div id="list"></div>
<script>
const DB={
PCM:["Civil Eng","Mechanical Eng","Electrical Eng","Software Eng","Computer Science","Architecture","Surveying","Telecom Eng","Petroleum","Data Science"],
PCB:["Medicine","Pharmacy","Dentistry","Nursing","Vet","Lab Science","Public Health","Physio","Biomed","Nutrition"],
BCM:["Actuarial Science","Statistics","Computer Science","Economics","Financial Math"],
PEM:["Economics","Commerce","Business Admin","Finance","Procurement","Marketing","Real Estate"],
BAG:["Law","Journalism","International Relations","Psychology","Tourism"],
MEG:["Literature","Education English","Law"],
HEG:["Law HEG","Economics HEG","History"],
DAG:["Theology","Education DAG"],
PAM:["Fine Art","Fashion Design","Graphic Design"]
};
let active="PCM";
function buildTabs(){
let h="";
for(let k in DB){
h+=`<button class='tab ${k==active?'active':''}' onclick="active='${k}';buildTabs();show()">${k} (${DB[k].length})</button>`;
}
document.getElementById("tabs").innerHTML=h;
}
function show(){
let q=(document.getElementById("q").value||"").toLowerCase();
let arr=DB;
let filtered=arr.filter(c=>c.toLowerCase().includes(q));
let html="";
filtered.forEach((c,i)=>{
let msg=encodeURIComponent("Hello CEO Kawa I want "+c);
html+=`<div class='card'><b>${i+1}. ${c}</b><div>${active} - Makerere / MUBS</div><div class='btns'><a class='btn w' href='https://wa.me/256792408497?text=${msg}'>WHATSAPP</a><a class='btn c' href='tel:+256792408497'>CALL</a></div></div>`;
});
document.getElementById("list").innerHTML=html;
}
buildTabs();show();
</script>
</body>
</html>[active]
