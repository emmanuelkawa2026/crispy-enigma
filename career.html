<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Led Hybrid</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef2ff;padding-bottom:20px}header{background:#1e3a8a;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:20}header h1{margin:0;font-size:16px;font-weight:900}.tabs{display:flex;gap:6px;overflow:auto;padding:8px;background:#fff;position:sticky;top:55px;z-index:19}.tab{white-space:nowrap;padding:8px 12px;border-radius:20px;border:2px solid #1e3a8a;font-weight:800;font-size:12px;background:#fff;color:#1e3a8a;cursor:pointer}.tab.active{background:#1e3a8a;color:#fff}.search{padding:8px;background:#eef2ff;position:sticky;top:102px;z-index:18}.search input{width:100%;padding:13px;border-radius:12px;border:2px solid #cbd5e1}.card{background:#fff;margin:8px;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.badge{display:inline-block;background:#dbeafe;color:#1e3a8a;padding:2px 6px;border-radius:7px;font-size:10px;font-weight:800;margin-right:4px}.course{font-weight:900;font-size:14px;margin:4px 0}.meta{font-size:11px;color:#475569;line-height:1.4}.salary{color:#16a34a;font-weight:800}.btns{display:flex;gap:6px;margin-top:8px}.btn{flex:1;text-align:center;padding:12px;border-radius:10px;text-decoration:none;font-weight:900;font-size:12px}.btn-w{background:#1e3a8a;color:#fff}.btn-c{background:#facc15;color:#000}</style></head><body><header><h1>TEAM LED HYBRID 360</h1><small>CEO Kawa 0792408497</small></header><div class="tabs" id="tabs"></div><div class="search"><input id="q" placeholder="Search courses..." oninput="render()"><div id="stats" style="text-align:center;font-size:11px;color:#475569;padding-top:6px"></div></div><div id="list"></div><script>
const P="256792408497";
const DB={"PCM":[{"c":"Civil Engineering","u":"Makerere / Kyambogo","s":"UGX 2M-8M","d":"Roads & Buildings"},{"c":"Software Engineering","u":"Makerere","s":"UGX 2.5M-12M","d":"Apps & Systems"},{"c":"Computer Science","u":"Makerere","s":"UGX 2M-10M","d":"Tech & IT"}],"PCB":[{"c":"Medicine MBChB","u":"Makerere","s":"UGX 3M-20M","d":"Doctor"},{"c":"Pharmacy","u":"Makerere","s":"UGX 2M-8M","d":"Pharmacist"},{"c":"Nursing","u":"Makerere","s":"UGX 1M-4M","d":"UK USA Jobs"}],"BCM":[{"c":"Actuarial Science","u":"Makerere","s":"UGX 2.5M-10M","d":"Banks Insurance"}],"PEM":[{"c":"Economics","u":"Makerere","s":"UGX 1.5M-7M","d":"Bank BOU"},{"c":"Commerce BCOM","u":"MUBS","s":"UGX 1.2M-6M","d":"CPA Business"}],"BAG":[{"c":"Law LLB","u":"Makerere","s":"UGX 2M-15M","d":"Advocate"},{"c":"Journalism","u":"Makerere","s":"UGX 800K-5M","d":"NTV NBS Media"}],"PAM":[{"c":"Fine Art","u":"Makerere","s":"UGX 700K-6M","d":"Graphics Design"}],"HEG":[{"c":"Law HEG","u":"Makerere","s":"UGX 2M-15M","d":"Lawyer"}],"DAG":[{"c":"Theology Divinity","u":"Makerere","s":"UGX 600K-3M","d":"Pastor Priest"}]};
let active="PCM";
function buildTabs(){let h="";for(let k in DB){h+="<button class='tab "+(k===active?"active":"")+"' onclick=\"setTab('"+k+"')\">"+k+" ("+DB.length+")</button>";}document.getElementById("tabs").innerHTML=h;}
function setTab(k){active=k;buildTabs();render();}
function render(){let q=(document.getElementById("q").value||"").toLowerCase();let arr=DB||[];let list=arr.filter(x=>!q||(x.c+" "+x.u+" "+x.d).toLowerCase().includes(q));let html="";list.forEach((it,i)=>{let msg=encodeURIComponent("Hello Team Led CEO Kawa, I want "+it.c+" for "+active);html+="<div class='card'><span class='badge'>"+active+"</span><span class='badge'>#"+(i+1)+"</span><div class='course'>"+(i+1)+". "+it.c+"</div><div class='meta'>"+it.u+"<br><span class='salary'>"+it.s+"</span><br>"+it.d+"</div><div class='btns'><a class='btn btn-w' href='https://wa.me/"+P+"?text="+msg+"'>WHATSAPP</a><a class='btn btn-c' href='tel:+"+P+"'>CALL</a></div></div>";});document.getElementById("list").innerHTML=html||"<div style='text-align:center;padding:20px'>No course found</div>";document.getElementById("stats").innerText=list.length+" courses in "+active;}
buildTabs();render();
</script></body></html>[k][active]
